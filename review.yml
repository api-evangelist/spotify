provider: Spotify
providerId: spotify
reviewer: API Evangelist
reviewedBy: Kin Lane
date: '2026-05-30'
scope: AsyncAPI / public webhook & streaming protocol review
verdict: no-public-webhook-or-streaming-protocol
verdictRationale: >
  Spotify does not publish a documented public webhook, server-sent events, or
  WebSocket protocol for developers. Every documented surface on
  developer.spotify.com is either (a) a synchronous REST endpoint on the Web API
  / Ads API or (b) a client-side SDK (Web Playback SDK, iOS SDK, Android SDK,
  Embeds) that exposes local in-process event listeners rather than a network
  contract. The Web Playback SDK does open a WebSocket connection to Spotify's
  Connect backend internally, but that wire protocol is proprietary — no wss://
  URL, subprotocol identifier, frame schema, or handshake is published, and the
  only public contract is the JavaScript event API on the Spotify.Player
  instance. Developers who need event-driven Spotify integrations must poll the
  Web API (e.g. /me/player, /me/player/recently-played, /me/tracks) or rely on
  third-party glue services (Zapier, n8n, Pipedream) that themselves poll.
findings:
  - finding: No public webhook endpoint, subscription API, or event delivery surface is documented.
    evidence:
      - The Web API documentation index, reference, and concepts pages contain
        no webhook, subscription, callback, or notification section.
      - The February 2026 and March 2026 changelogs introduce REST endpoint
        changes only; neither announces a webhook or streaming surface.
      - Long-standing community requests for webhook support remain open with
        no official Spotify commitment.
    sources:
      - https://developer.spotify.com/documentation/web-api
      - https://developer.spotify.com/documentation/web-api/reference
      - https://developer.spotify.com/documentation/web-api/concepts/api-calls
      - https://developer.spotify.com/documentation/web-api/references/changes/february-2026
      - https://developer.spotify.com/documentation/web-api/references/changes/march-2026
      - https://github.com/spotify/web-api/issues/538
      - https://community.spotify.com/t5/Spotify-for-Developers/Spotify-webhook-support/td-p/5669938
  - finding: The Web Playback SDK exposes only client-side JavaScript events, not a public WebSocket protocol.
    evidence:
      - The SDK is described as a client-side JavaScript library.
      - Documented events on the Spotify.Player instance are ready, not_ready,
        player_state_changed, autoplay_failed, initialization_error,
        authentication_error, account_error, and playback_error.
      - No wss:// URL, subprotocol, message schema, or handshake is published
        in the Web Playback SDK reference.
    sources:
      - https://developer.spotify.com/documentation/web-playback-sdk
      - https://developer.spotify.com/documentation/web-playback-sdk/reference
  - finding: The internal Connect WebSocket used by Spotify clients is not a public protocol.
    evidence:
      - Spotify's playback / device-control fabric (Spotify Connect) is reached
        via a long-lived WebSocket that the official clients and the Web
        Playback SDK negotiate internally.
      - Spotify does not document the dealer/accesspoint endpoints, the
        Hermes/protobuf framing, or the device-state messages anywhere on
        developer.spotify.com.
      - Third-party reverse-engineered libraries (librespot, etc.) exist but
        are not sanctioned and do not constitute a documented public surface.
    sources:
      - https://developer.spotify.com/documentation/web-playback-sdk
      - https://developer.spotify.com/documentation
  - finding: The Ads API is REST-only with no documented webhook or streaming surface.
    evidence:
      - Ads API documentation covers campaign management, reporting, and asset
        endpoints under a synchronous request/response model.
      - Reporting endpoints use continuation tokens (pull/poll), not push
        notifications.
    sources:
      - https://developer.spotify.com/documentation/ads-api
  - finding: Event-driven Spotify use cases are implemented via polling.
    evidence:
      - The recommended pattern in Spotify community threads is to poll
        /me/player, /me/player/recently-played, /me/tracks, and playlist
        endpoints on an interval.
      - Third-party automation platforms (Zapier "New Saved Track", "New
        Playlist", n8n, Pipedream) all wrap Spotify REST polling under the
        hood; they do not consume a Spotify-issued webhook.
    sources:
      - https://developer.spotify.com/documentation/web-api/reference/get-the-users-currently-playing-track
      - https://developer.spotify.com/documentation/web-api/reference/get-recently-played
      - https://zapier.com/apps/spotify/integrations/webhook
      - https://n8n.io/integrations/webhook/and/spotify/
probes:
  - probe: WebFetch https://developer.spotify.com/documentation/web-api
    status: 200
    note: Confirms Web API is REST-only; no webhook/streaming/SSE section exists.
  - probe: WebFetch https://developer.spotify.com/documentation
    status: 200
    note: Top-level catalog lists Web API, Web Playback SDK, Ads API, iOS SDK,
      Android SDK, Embeds, Commercial Hardware. No webhook or streaming product.
  - probe: WebFetch https://developer.spotify.com/documentation/web-playback-sdk
    status: 200
    note: Client-side JS library only; no public wire protocol.
  - probe: WebFetch https://developer.spotify.com/documentation/web-playback-sdk/reference
    status: 200
    note: Eight documented player events; no wss:// URL, subprotocol, or frame schema.
  - probe: WebFetch https://developer.spotify.com/documentation/ads-api
    status: 200
    note: REST-only; pagination via continuation tokens, no push notifications.
  - probe: WebSearch "Spotify Web API webhooks public documentation 2026"
    status: ok
    note: Returned only official Spotify Web API pages plus third-party glue
      services; no official webhook surface surfaced.
  - probe: WebSearch "Spotify developer webhook event subscription notification"
    status: ok
    note: Community thread and GitHub issue confirm webhooks remain unsupported.
publicWebhookProtocol: false
publicWebSocketProtocol: false
publicSSEProtocol: false
publicGrpcStreamingProtocol: false
serverSentEventsDocumented: false
eventDeliveryMechanisms:
  - mechanism: REST polling (Web API)
    transport: HTTPS GET
    auth: OAuth 2.0 (Authorization Code, PKCE, Client Credentials)
    docs: https://developer.spotify.com/documentation/web-api
    note: Player state, recently-played, saved items, and playlist diffs must
      be detected by client polling. Subject to per-app and per-user rate limits.
  - mechanism: Web Playback SDK in-process events
    transport: JavaScript event listeners on Spotify.Player
    auth: Bearer token supplied to the SDK
    docs: https://developer.spotify.com/documentation/web-playback-sdk/reference
    note: Local-only; not a network contract. Events fire inside the browser tab
      hosting the SDK and cannot be consumed by an external service directly.
sdkInternalRealtime:
  transport: WebSocket (Spotify Connect / dealer) + proprietary framing
  purpose: Device discovery, playback state synchronization, transfer between
    Spotify Connect devices, and remote control from the Spotify clients and
    Web Playback SDK.
  publiclyContracted: false
  note: >
    The wire protocol between Spotify clients (including the Web Playback SDK)
    and the Spotify Connect backend is not published. Customers integrate via
    the supported SDKs and the Web API rather than by speaking the wire protocol
    directly. There is no documented way for a third-party server to open a
    wss:// session against Spotify and receive playback events.
decision:
  produceAsyncAPI: false
  produceWebhookOpenAPI: false
  reason: >
    Producing an AsyncAPI 2.6 / 3.0 spec or an OpenAPI webhooks document would
    require fabricating channel URLs, message schemas, signature headers, and
    operation bindings that Spotify has not published. The documented event
    surface is fully covered by the existing REST OpenAPI artifact at
    openapi/spotify-openapi-original.yml (polling /me/player, /me/player/
    recently-played, /me/tracks, and playlist endpoints). No AsyncAPI or
    webhook artifact will be added to apis.yml.
  alternatives:
    - Continue polling-based event capture against the existing Web API OpenAPI.
    - Re-evaluate if Spotify publishes a documented webhook, SSE, or WebSocket
      surface in a future changelog entry.
