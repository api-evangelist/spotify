naftiko: 1.0.0-alpha2
info:
  label: Spotify Web API — Chapters
  description: 'Spotify Web API — Chapters. 3 operations. Lead operation: Get Audiobook Chapters. Self-contained Naftiko capability
    covering one Spotify business surface.'
  tags:
  - Spotify
  - Chapters
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPOTIFY_API_KEY: SPOTIFY_API_KEY
capability:
  consumes:
  - type: http
    namespace: spotify-chapters
    baseUri: https://api.spotify.com/v1
    description: Spotify Web API — Chapters business capability. Self-contained, no shared references.
    resources:
    - name: audiobooks-id-chapters
      path: /audiobooks/{id}/chapters
      operations:
      - name: getaudiobookchapters
        method: GET
        description: Get Audiobook Chapters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: chapters
      path: /chapters
      operations:
      - name: getseveralchapters
        method: GET
        description: Get Several Chapters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: chapters-id
      path: /chapters/{id}
      operations:
      - name: getachapter
        method: GET
        description: Get a Chapter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SPOTIFY_API_KEY}}'
  exposes:
  - type: rest
    namespace: spotify-chapters-rest
    port: 8080
    description: REST adapter for Spotify Web API — Chapters. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/audiobooks/{id}/chapters
      name: audiobooks-id-chapters
      description: REST surface for audiobooks-id-chapters.
      operations:
      - method: GET
        name: getaudiobookchapters
        description: Get Audiobook Chapters
        call: spotify-chapters.getaudiobookchapters
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/chapters
      name: chapters
      description: REST surface for chapters.
      operations:
      - method: GET
        name: getseveralchapters
        description: Get Several Chapters
        call: spotify-chapters.getseveralchapters
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/chapters/{id}
      name: chapters-id
      description: REST surface for chapters-id.
      operations:
      - method: GET
        name: getachapter
        description: Get a Chapter
        call: spotify-chapters.getachapter
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: spotify-chapters-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spotify Web API — Chapters. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-audiobook-chapters
      description: Get Audiobook Chapters
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: spotify-chapters.getaudiobookchapters
      outputParameters:
      - type: object
        mapping: $.
    - name: get-several-chapters
      description: Get Several Chapters
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: spotify-chapters.getseveralchapters
      outputParameters:
      - type: object
        mapping: $.
    - name: get-chapter
      description: Get a Chapter
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: spotify-chapters.getachapter
      outputParameters:
      - type: object
        mapping: $.
