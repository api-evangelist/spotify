naftiko: 1.0.0-alpha2
info:
  label: Spotify Web API — Markets
  description: 'Spotify Web API — Markets. 1 operations. Lead operation: Get Available Markets. Self-contained Naftiko capability
    covering one Spotify business surface.'
  tags:
  - Spotify
  - Markets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPOTIFY_API_KEY: SPOTIFY_API_KEY
capability:
  consumes:
  - type: http
    namespace: spotify-markets
    baseUri: https://api.spotify.com/v1
    description: Spotify Web API — Markets business capability. Self-contained, no shared references.
    resources:
    - name: markets
      path: /markets
      operations:
      - name: getavailablemarkets
        method: GET
        description: Get Available Markets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SPOTIFY_API_KEY}}'
  exposes:
  - type: rest
    namespace: spotify-markets-rest
    port: 8080
    description: REST adapter for Spotify Web API — Markets. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/markets
      name: markets
      description: REST surface for markets.
      operations:
      - method: GET
        name: getavailablemarkets
        description: Get Available Markets
        call: spotify-markets.getavailablemarkets
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: spotify-markets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spotify Web API — Markets. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-available-markets
      description: Get Available Markets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: spotify-markets.getavailablemarkets
      outputParameters:
      - type: object
        mapping: $.
