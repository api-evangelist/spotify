naftiko: 1.0.0-alpha2
info:
  label: Spotify Web API — Search
  description: 'Spotify Web API — Search. 1 operations. Lead operation: Search for Item. Self-contained Naftiko capability
    covering one Spotify business surface.'
  tags:
  - Spotify
  - Search
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPOTIFY_API_KEY: SPOTIFY_API_KEY
capability:
  consumes:
  - type: http
    namespace: spotify-search
    baseUri: https://api.spotify.com/v1
    description: Spotify Web API — Search business capability. Self-contained, no shared references.
    resources:
    - name: search
      path: /search
      operations:
      - name: search
        method: GET
        description: Search for Item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          required: true
        - name: type
          in: query
          type: array
          required: true
        - name: limit
          in: query
          type: integer
        - name: offset
          in: query
          type: integer
        - name: include_external
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.SPOTIFY_API_KEY}}'
  exposes:
  - type: rest
    namespace: spotify-search-rest
    port: 8080
    description: REST adapter for Spotify Web API — Search. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/search
      name: search
      description: REST surface for search.
      operations:
      - method: GET
        name: search
        description: Search for Item
        call: spotify-search.search
        with:
          q: rest.q
          type: rest.type
          limit: rest.limit
          offset: rest.offset
          include_external: rest.include_external
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: spotify-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spotify Web API — Search. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: search-item
      description: Search for Item
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: spotify-search.search
      with:
        q: tools.q
        type: tools.type
        limit: tools.limit
        offset: tools.offset
        include_external: tools.include_external
      outputParameters:
      - type: object
        mapping: $.
