naftiko: 1.0.0-alpha2
info:
  label: Spotify Web API — Player
  description: 'Spotify Web API — Player. 15 operations. Lead operation: Get Playback State. Self-contained Naftiko capability
    covering one Spotify business surface.'
  tags:
  - Spotify
  - Player
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPOTIFY_API_KEY: SPOTIFY_API_KEY
capability:
  consumes:
  - type: http
    namespace: spotify-player
    baseUri: https://api.spotify.com/v1
    description: Spotify Web API — Player business capability. Self-contained, no shared references.
    resources:
    - name: me-player
      path: /me/player
      operations:
      - name: getinformationabouttheuserscurrentplayback
        method: GET
        description: Get Playback State
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: transferausersplayback
        method: PUT
        description: Transfer Playback
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: me-player-currently-playing
      path: /me/player/currently-playing
      operations:
      - name: gettheuserscurrentlyplayingtrack
        method: GET
        description: Get Currently Playing Track
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: me-player-devices
      path: /me/player/devices
      operations:
      - name: getausersavailabledevices
        method: GET
        description: Get Available Devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: me-player-next
      path: /me/player/next
      operations:
      - name: skipusersplaybacktonexttrack
        method: POST
        description: Skip To Next
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: device_id
          in: query
          type: string
    - name: me-player-pause
      path: /me/player/pause
      operations:
      - name: pauseausersplayback
        method: PUT
        description: Pause Playback
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: device_id
          in: query
          type: string
    - name: me-player-play
      path: /me/player/play
      operations:
      - name: startausersplayback
        method: PUT
        description: Start/Resume Playback
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: device_id
          in: query
          type: string
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: me-player-previous
      path: /me/player/previous
      operations:
      - name: skipusersplaybacktoprevioustrack
        method: POST
        description: Skip To Previous
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: device_id
          in: query
          type: string
    - name: me-player-queue
      path: /me/player/queue
      operations:
      - name: getqueue
        method: GET
        description: Get the User's Queue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: addtoqueue
        method: POST
        description: Add Item to Playback Queue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: uri
          in: query
          type: string
          required: true
        - name: device_id
          in: query
          type: string
    - name: me-player-recently-played
      path: /me/player/recently-played
      operations:
      - name: getrecentlyplayed
        method: GET
        description: Get Recently Played Tracks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
        - name: after
          in: query
          type: integer
        - name: before
          in: query
          type: integer
    - name: me-player-repeat
      path: /me/player/repeat
      operations:
      - name: setrepeatmodeonusersplayback
        method: PUT
        description: Set Repeat Mode
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: state
          in: query
          type: string
          required: true
        - name: device_id
          in: query
          type: string
    - name: me-player-seek
      path: /me/player/seek
      operations:
      - name: seektopositionincurrentlyplayingtrack
        method: PUT
        description: Seek To Position
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: position_ms
          in: query
          type: integer
          required: true
        - name: device_id
          in: query
          type: string
    - name: me-player-shuffle
      path: /me/player/shuffle
      operations:
      - name: toggleshuffleforusersplayback
        method: PUT
        description: Toggle Playback Shuffle
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: state
          in: query
          type: boolean
          required: true
        - name: device_id
          in: query
          type: string
    - name: me-player-volume
      path: /me/player/volume
      operations:
      - name: setvolumeforusersplayback
        method: PUT
        description: Set Playback Volume
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: volume_percent
          in: query
          type: integer
          required: true
        - name: device_id
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.SPOTIFY_API_KEY}}'
