              maximum: 1
              description: The confidence, from 0.0 to 1.0, of the reliability of the `tempo`.
            time_signature:
              $ref: '#/components/schemas/TimeSignature'
            time_signature_confidence:
              type: number
              example: 0.994
              minimum: 0
              maximum: 1
